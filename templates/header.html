<header class="bg-gradient-to-r from-blue-600 via-blue-700 to-blue-800 text-white shadow-xl">
    <div class="container mx-auto px-6 py-5">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-white bg-opacity-20 rounded-full flex items-center justify-center">
                    <span class="text-2xl">🏥</span>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">Pusat Rawatan Warga</h1>
                    <p class="text-sm text-blue-100 opacity-90">Healthcare System Prototype</p>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <button id="notif-btn" class="relative p-3 hover:bg-white hover:bg-opacity-10 rounded-full transition-all duration-200 group">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-5-5V12a7 7 0 00-14 0v5h5m0 0v1a3 3 0 006 0v-1m-6 0h6"></path>
                    </svg>
                    {% if notification_count > 0 %}
                        <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold">{{ notification_count }}</span>
                    {% endif %}
                </button>
                <div class="text-right">
                    <p id="user-name" class="font-semibold text-lg">{{ user.name }}</p>
                    <p id="user-type" class="text-sm text-blue-100 opacity-80">{{ user.role|title }}</p>
                </div>
                <a href="/logout" class="px-6 py-2 bg-red-500 hover:bg-red-600 text-white rounded-full font-medium transition-all duration-200 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                    Logout
                </a>
            </div>
        </div>
    </div>
</header>
