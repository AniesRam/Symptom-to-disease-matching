<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Rawatan Warga - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .header-gradient { background: linear-gradient(to right, #2563eb, #1e40af); }
        .card-border { border: 1px solid #e5e7eb; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg card-border w-full max-w-md text-center">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Welcome to Pusat Rawatan Warga Healthcare System Prototype</h1>
        <p class="text-gray-600 mb-6">Your health, our priority. Please log in or register to access our website services.</p>
        <div class="space-y-4">
            <a href="/login" class="block w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Login</a>
            <a href="/register" class="block w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">New Patient? Register Here</a>
            <a href="/doctor-register" class="block w-full px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">Doctor/Nurse? Register Here</a>
            <a href="/admin-register" class="block w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">Admin? Register Here</a>
        </div>
    </div>

</html>
