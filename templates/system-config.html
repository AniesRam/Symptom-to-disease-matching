<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Rawatan Warga - System Configuration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .header-gradient { background: linear-gradient(to right, #2563eb, #1e40af); }
        .card-border { border: 1px solid #e5e7eb; }
        button:hover { background-color: #e5e7eb; transform: scale(1.05); transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    {% include 'header.html' %}
    <div class="container mx-auto px-4 py-6">
        <div class="flex gap-6">
            {% include 'sidebar.html' %}
            <main class="flex-1">
                {% if user.role == 'admin' %}
                    <div class="bg-white p-6 rounded-lg shadow-lg card-border">
                        <h2 class="text-2xl font-bold mb-4">⚙️ System Configuration</h2>
                        <p class="text-gray-600 mb-6">Adjust settings, notifications, AI parameters, and manage backups/logs.</p>
                        <form class="space-y-4">
                            <div>
                                <label for="notifications" class="block text-gray-700 font-medium">Notification Settings</label>
                                <select id="notifications" class="w-full px-3 py-2 border rounded-lg">
                                    <option value="enabled">Enabled</option>
                                    <option value="disabled">Disabled</option>
                                </select>
                            </div>
                            <div>
                                <label for="ai-threshold" class="block text-gray-700 font-medium">AI Alert Threshold (%)</label>
                                <input type="number" id="ai-threshold" value="80" class="w-full px-3 py-2 border rounded-lg">
                            </div>
                            <div>
                                <label for="backup-frequency" class="block text-gray-700 font-medium">Backup Frequency</label>
                                <select id="backup-frequency" class="w-full px-3 py-2 border rounded-lg">
                                    <option value="daily">Daily</option>
                                    <option value="weekly">Weekly</option>
                                </select>
                            </div>
                            <button type="submit" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save Settings</button>
                        </form>
                        <div class="mt-6">
                            <button class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700">View Logs</button>
                            <button class="ml-4 px-6 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700">Run Backup</button>
                        </div>
                    </div>
                {% else %}
                    <p class="text-gray-600">Access denied. Admin role required.</p>
                {% endif %}
            </main>
        </div>
    </div>
    {% include 'scripts.html' %}
</body>
</html>
