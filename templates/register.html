<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Rawatan Warga - Patient Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .header-gradient { background: linear-gradient(to right, #2563eb, #1e40af); }
        .card-border { border: 1px solid #e5e7eb; }
        button:hover { background-color: #e5e7eb; transform: scale(1.05); transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="header-gradient text-white text-center py-6 rounded-t-lg">
            <h1 class="text-2xl font-bold">Pusat Rawatan Warga</h1>
            <p class="text-sm">Patient Registration</p>
        </div>
        <div class="bg-white p-6 rounded-b-lg shadow-lg card-border">
            <form action="/register" method="POST">  <!-- Flask route for patient registration -->
                <div class="mb-4">
                    <label for="name" class="block text-gray-700 font-medium">Full Name</label>
                    <input type="text" id="name" name="name" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 font-medium">Email</label>
                    <input type="email" id="email" name="email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-gray-700 font-medium">Password</label>
                    <input type="password" id="password" name="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label for="phone" class="block text-gray-700 font-medium">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label for="dob" class="block text-gray-700 font-medium">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Register</button>
            </form>
            <p class="text-center mt-4 text-sm text-gray-600">
                Already have an account? <a href="/login" class="text-blue-600 hover:underline">Login here</a>
            </p>
        </div>
    </div>
</body>
</html>
